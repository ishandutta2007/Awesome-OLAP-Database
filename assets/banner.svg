<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Column Bar Gradients -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.85" />
    </linearGradient>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes scanBeam {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.7; }
      100% { transform: translateY(260px); opacity: 0.1; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(8px); }
    }
    @keyframes barPulse1 {
      0%, 100% { height: 120px; y: 190px; }
      50% { height: 160px; y: 150px; }
    }
    @keyframes barPulse2 {
      0%, 100% { height: 170px; y: 140px; }
      50% { height: 110px; y: 200px; }
    }
    @keyframes barPulse3 {
      0%, 100% { height: 140px; y: 170px; }
      50% { height: 190px; y: 120px; }
    }
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.6; }
    .neon-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .scan-beam { animation: scanBeam 4s ease-in-out infinite alternate; }
    .flow-line { stroke-dasharray: 20, 10; animation: flowLine 12s linear infinite; }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1.5s; }
    .bar-anim-1 { animation: barPulse1 4s ease-in-out infinite; }
    .bar-anim-2 { animation: barPulse2 5s ease-in-out infinite 0.7s; }
    .bar-anim-3 { animation: barPulse3 4.5s ease-in-out infinite 1.2s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />

  <!-- Animated Ambient Nebula Glows in Background -->
  <g class="neon-pulse">
    <circle cx="200" cy="90" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
    <circle cx="1020" cy="270" r="160" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
    <circle cx="620" cy="180" r="180" fill="#3b82f6" opacity="0.08" filter="url(#glow)" />
  </g>

  <!-- Subtle Perspective OLAP Analytical Grid Lines -->
  <g class="grid-line">
    <line x1="60" y1="50" x2="1140" y2="50" />
    <line x1="60" y1="110" x2="1140" y2="110" />
    <line x1="60" y1="170" x2="1140" y2="170" />
    <line x1="60" y1="230" x2="1140" y2="230" />
    <line x1="60" y1="290" x2="1140" y2="290" />
    <line x1="60" y1="350" x2="1140" y2="350" />

    <line x1="120" y1="40" x2="120" y2="360" />
    <line x1="260" y1="40" x2="260" y2="360" />
    <line x1="400" y1="40" x2="400" y2="360" />
    <line x1="540" y1="40" x2="540" y2="360" />
    <line x1="680" y1="40" x2="680" y2="360" />
    <line x1="820" y1="40" x2="820" y2="360" />
    <line x1="960" y1="40" x2="960" y2="360" />
    <line x1="1100" y1="40" x2="1100" y2="360" />
  </g>

  <!-- Flowing Pipeline Data Rays (Dynamic Background) -->
  <path d="M 60,310 Q 300,280 600,310 T 1140,290" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4" class="flow-line" />
  <path d="M 60,70 Q 340,110 650,60 T 1140,80" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4" class="flow-line" />

  <!-- Background Columnar Analytics Bars on the Right Side (Dynamic Animated) -->
  <g opacity="0.35">
    <rect x="940" y="190" width="22" height="120" rx="4" fill="url(#barGrad1)" class="bar-anim-1" />
    <rect x="970" y="140" width="22" height="170" rx="4" fill="url(#barGrad2)" class="bar-anim-2" />
    <rect x="1000" y="170" width="22" height="140" rx="4" fill="url(#barGrad3)" class="bar-anim-3" />
    <rect x="1030" y="130" width="22" height="180" rx="4" fill="url(#barGrad1)" class="bar-anim-2" />
    <rect x="1060" y="180" width="22" height="130" rx="4" fill="url(#barGrad2)" class="bar-anim-1" />
    <rect x="1090" y="150" width="22" height="160" rx="4" fill="url(#barGrad3)" class="bar-anim-3" />
  </g>

  <!-- Floating Vector Nodes (Dynamic Background) -->
  <g class="particle-1">
    <circle cx="150" cy="140" r="4" fill="#06b6d4" opacity="0.8" />
    <circle cx="150" cy="140" r="10" fill="#06b6d4" opacity="0.2" />
    <circle cx="1080" cy="100" r="3" fill="#8b5cf6" opacity="0.8" />
  </g>
  <g class="particle-2">
    <circle cx="210" cy="270" r="3.5" fill="#3b82f6" opacity="0.8" />
    <circle cx="890" cy="240" r="4.5" fill="#10b981" opacity="0.8" />
  </g>

  <!-- Laser Scan Beam in Background -->
  <line x1="80" y1="50" x2="1120" y2="50" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" class="scan-beam" />

  <!-- Dark Shield Behind Center Content to Guarantee Readability -->
  <rect x="120" y="45" width="960" height="290" rx="20" fill="#0b0f19" fill-opacity="0.82" stroke="#1e293b" stroke-width="1.5" filter="url(#cardShadow)" />

  <!-- FOREGROUND CONTENT: Guaranteed sharp, clear & fully accessible -->
  <!-- Top Category Pill -->
  <g transform="translate(600, 92)">
    <rect x="-195" y="-16" width="390" height="32" rx="16" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">
      ⚡ REAL-TIME ANALYTICS &amp; COLUMNAR ENGINES ⚡
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="170" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="1.5">
    AWESOME <tspan fill="url(#cyanBlueGrad)">OLAP DATABASE</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    The Curated Ecosystem for Columnar Storage, Vectorized Execution &amp; Cloud Warehouses
  </text>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: DuckDB -->
    <g transform="translate(-320, 0)">
      <rect x="-55" y="-15" width="110" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🦆 DuckDB</text>
    </g>
    <!-- Pill 2: ClickHouse -->
    <g transform="translate(-195, 0)">
      <rect x="-60" y="-15" width="120" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">⚡ ClickHouse</text>
    </g>
    <!-- Pill 3: StarRocks -->
    <g transform="translate(-70, 0)">
      <rect x="-55" y="-15" width="110" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">⭐ StarRocks</text>
    </g>
    <!-- Pill 4: Doris -->
    <g transform="translate(55, 0)">
      <rect x="-60" y="-15" width="120" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🐘 Apache Doris</text>
    </g>
    <!-- Pill 5: Snowflake -->
    <g transform="translate(185, 0)">
      <rect x="-60" y="-15" width="120" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">❄️ Snowflake</text>
    </g>
    <!-- Pill 6: BigQuery -->
    <g transform="translate(315, 0)">
      <rect x="-60" y="-15" width="120" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text text-anchor="middle" y="5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">🔍 BigQuery</text>
    </g>
  </g>

  <!-- Bottom Accent Border -->
  <rect x="0" y="376" width="1200" height="4" fill="url(#cyanBlueGrad)" />
</svg>
